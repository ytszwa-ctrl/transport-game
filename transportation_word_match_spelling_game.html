<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transportation Word Match & Spelling Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-fun {
      font-family: 'Fredoka', cursive;
    }
    .game-card-shadow {
      box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.12);
    }
    .selected-card {
      transform: scale(1.03);
      border-color: #3b82f6 !important;
      background-color: #eff6ff !important;
      box-shadow: 0 8px 0 0 #2563eb !important;
    }
    .matched-card {
      opacity: 0.45;
      pointer-events: none;
      filter: grayscale(0.2);
    }
    .hint-highlight {
      animation: pulse-border 1.2s infinite ease-in-out;
    }
    @keyframes pulse-border {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
    }
    .animate-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col justify-between p-2 sm:p-4">

  <!-- Header Header & Navigation -->
  <header class="max-w-4xl w-full mx-auto bg-white/90 backdrop-blur rounded-3xl p-3 sm:p-4 shadow-lg border-4 border-amber-200 mb-3">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
      <div>
        <h1 class="font-fun text-xl sm:text-2xl font-bold text-amber-600 flex items-center gap-2">
          <span>🚗</span> 交通工具英文學習小遊戲
        </h1>
        <p class="text-xs text-slate-500 font-bold">Cambridge YLE Starters Vocabulary • Reading & Writing</p>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
        <button id="tab-match" onclick="switchMode('match')" class="font-fun px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all bg-sky-500 text-white shadow-md flex items-center gap-1.5">
          <span>🧩</span> 圖畫配對
        </button>
        <button id="tab-spell" onclick="switchMode('spell')" class="font-fun px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all text-slate-600 hover:bg-white/60 flex items-center gap-1.5">
          <span>✏️</span> 劍橋串字
        </button>
      </div>
    </div>

    <!-- Status Bar (Progress & Hint Button) -->
    <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-600">進度:</span>
        <div class="w-28 sm:w-40 bg-slate-200 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-300">
          <div id="progress-bar" class="bg-amber-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="progress-text" class="font-fun font-bold text-amber-700">0/12</span>
      </div>

      <button onclick="useHint()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 border-2 border-amber-300 font-fun px-3 py-1 rounded-xl flex items-center gap-1 shadow-sm transition-transform active:scale-95 text-xs sm:text-sm">
        💡 提示 (<span id="hint-count">3</span>)
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-center">
    
    <!-- MODE 1: Matching Game -->
    <div id="mode-matching-container" class="grid grid-cols-2 gap-3 sm:gap-6">
      <!-- Words Column -->
      <div class="flex flex-col gap-2.5" id="words-container">
        <!-- JS dynamic cards -->
      </div>
      <!-- Pictures Column -->
      <div class="grid grid-cols-2 gap-2 sm:gap-3" id="pictures-container">
        <!-- JS dynamic picture cards -->
      </div>
    </div>

    <!-- MODE 2: Spelling Game (Cambridge Starters Style) -->
    <div id="mode-spelling-container" class="hidden flex flex-col items-center justify-center bg-white rounded-3xl p-4 sm:p-6 shadow-xl border-4 border-emerald-300 max-w-xl mx-auto w-full relative">
      
      <!-- Phonics Hint Display (Revealed on error or hint) -->
      <div id="phonics-hint-box" class="hidden mb-3 w-full bg-amber-50 border-2 border-amber-300 rounded-2xl p-2.5 text-center animate-pop">
        <div class="text-xs font-bold text-amber-700 flex items-center justify-center gap-1">
          <span>🔤 自然拼音 (Phonics) 拆解提示:</span>
          <button onclick="speakPhonicsHint()" class="bg-amber-200 hover:bg-amber-300 p-1 rounded-full text-xs">🔊 聽拼音</button>
        </div>
        <div id="phonics-text" class="font-fun text-lg text-amber-900 font-bold tracking-widest my-0.5"></div>
        <div id="phonics-detail" class="text-xs text-amber-600"></div>
      </div>

      <!-- Target Picture Frame -->
      <div class="relative group cursor-pointer mb-3" onclick="speakCurrentSpellingWord()">
        <div id="spelling-image-box" class="w-32 h-32 sm:w-40 sm:h-40 bg-sky-50 rounded-2xl p-4 border-4 border-sky-200 shadow-inner flex items-center justify-center transition-transform group-hover:scale-105">
          <!-- Dynamic SVG -->
        </div>
        <button class="absolute -bottom-2 -right-2 bg-amber-400 hover:bg-amber-500 text-amber-950 p-2 rounded-full shadow-md text-xs font-bold flex items-center gap-1 border-2 border-white">
          🔊 聽發音
        </button>
      </div>

      <!-- Letter Slots -->
      <div id="spelling-slots" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mb-5 min-h-[50px]">
        <!-- Dynamic Slots -->
      </div>

      <!-- Jumbled Letter Selection Tiles -->
      <div id="spelling-tiles" class="flex flex-wrap items-center justify-center gap-2 mb-4">
        <!-- Dynamic Letter Tiles -->
      </div>

      <!-- Spelling Controls -->
      <div class="flex items-center gap-2 w-full justify-center">
        <button onclick="backspaceSpelling()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-fun text-xs sm:text-sm px-3 py-2 rounded-xl border border-rose-300 flex items-center gap-1">
          ⌫ 刪除
        </button>
        <button onclick="clearSpelling()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-fun text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-300">
          🗑️ 清除
        </button>
        <button id="prev-spell-btn" onclick="navSpelling(-1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-fun text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-300">
          ⬅️ 上一個
        </button>
        <button onclick="navSpelling(1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-fun text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-300">
          下一個 ➡️
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-3 text-center text-xs text-slate-400 font-semibold">
    Transportation Cambridge Starter Word List • Interactive Learning Game
  </footer>

  <!-- Victory Celebration Modal -->
  <div id="victory-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 relative animate-pop">
      <div class="text-5xl mb-3">🏆</div>
      <h3 id="modal-title" class="font-fun text-2xl text-amber-600 mb-2">配對完成！</h3>
      <p id="modal-msg" class="text-sm font-bold text-slate-600 mb-5">恭喜你完成挑戰！</p>
      <button onclick="resetCurrentGame()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-fun px-6 py-2.5 rounded-2xl border-b-4 border-emerald-700 text-base shadow-lg w-full">
        🎉 再玩一次
      </button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Global Game State
    let currentMode = 'match'; // 'match' or 'spell'
    let spellingIndex = 0;
    let spellingInput = [];
    let currentJumbledLetters = [];
    let selectedWord = null;
    let selectedPicture = null;
    let matchedPairs = 0;
    let hintsRemaining = 3;

    // Vocabulary Data: Strictly Sentence Case with Phonics sound breakdown hints
    const vocabulary = [
      { id: 'truck', name: 'Truck', color: 'bg-red-50 border-red-400 text-red-600', phonics: 'tr - u - ck', hint: '/tr/ sound + /ʌ/ + /k/' },
      { id: 'plane', name: 'Plane', color: 'bg-sky-50 border-sky-400 text-sky-700', phonics: 'pl - a - ne', hint: '/pl/ sound + silent \'e\' makes \'a\' say its name /eɪ/' },
      { id: 'train', name: 'Train', color: 'bg-amber-50 border-amber-400 text-amber-800', phonics: 'tr - ai - n', hint: '/tr/ sound + /eɪ/ (\'ai\') + /n/' },
      { id: 'bike', name: 'Bike', color: 'bg-emerald-50 border-emerald-400 text-emerald-800', phonics: 'b - i - ke', hint: '/b/ + silent \'e\' makes \'i\' say its name /aɪ/ + /k/' },
      { id: 'car', name: 'Car', color: 'bg-indigo-50 border-indigo-400 text-indigo-800', phonics: 'c - ar', hint: '/k/ + Bossy \'R\' sound /ɑːr/' },
      { id: 'bus', name: 'Bus', color: 'bg-yellow-50 border-yellow-400 text-yellow-800', phonics: 'b - u - s', hint: '/b/ + short /ʌ/ + /s/' },
      { id: 'boat', name: 'Boat', color: 'bg-cyan-50 border-cyan-400 text-cyan-800', phonics: 'b - oa - t', hint: '/b/ + vowel team \'oa\' /oʊ/ + /t/' },
      { id: 'helicopter', name: 'Helicopter', color: 'bg-teal-50 border-teal-400 text-teal-800', phonics: 'hel - i - cop - ter', hint: '4 Syllables: hel-i-cop-ter' },
      { id: 'lorry', name: 'Lorry', color: 'bg-purple-50 border-purple-400 text-purple-800', phonics: 'l - or - ry', hint: '/l/ + \'or\' /ɔːr/ + double \'r\' + \'y\' sound /i/' },
      { id: 'taxi', name: 'Taxi', color: 'bg-amber-100 border-yellow-500 text-amber-900', phonics: 'tax - i', hint: '2 Syllables: tax-i (/tæks-i/)' },
      { id: 'motorbike', name: 'Motorbike', color: 'bg-rose-50 border-rose-400 text-rose-800', phonics: 'mo - tor - bike', hint: 'mo-tor + b-i-ke' },
      { id: 'ship', name: 'Ship', color: 'bg-blue-50 border-blue-500 text-blue-900', phonics: 'sh - i - p', hint: 'Digraph \'sh\' /ʃ/ + short /ɪ/ + /p/' }
    ];

    const svgIcons = {
      truck: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><rect x="10" y="35" width="50" height="35" rx="4" fill="#ef4444"/><rect x="60" y="45" width="25" height="25" rx="3" fill="#dc2626"/><path d="M70 45 L85 55 L85 70 L70 70 Z" fill="#991b1b"/><rect x="63" y="48" width="10" height="10" fill="#bae6fd" rx="2"/><circle cx="25" cy="72" r="9" fill="#334155"/><circle cx="25" cy="72" r="4" fill="#94a3b8"/><circle cx="45" cy="72" r="9" fill="#334155"/><circle cx="45" cy="72" r="4" fill="#94a3b8"/><circle cx="75" cy="72" r="9" fill="#334155"/><circle cx="75" cy="72" r="4" fill="#94a3b8"/></svg>`,
      plane: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><path d="M10 50 Q30 35 70 42 L88 30 Q92 35 88 50 L75 58 L45 85 L35 82 L48 58 L25 58 L18 68 L10 66 L15 50 Z" fill="#0284c7"/><path d="M40 45 Q60 42 75 48" stroke="#bae6fd" stroke-width="3" fill="none"/><circle cx="65" cy="47" r="2" fill="#ffffff"/><circle cx="58" cy="46" r="2" fill="#ffffff"/><circle cx="51" cy="45" r="2" fill="#ffffff"/></svg>`,
      train: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><rect x="15" y="30" width="60" height="40" rx="6" fill="#f59e0b"/><rect x="75" y="25" width="15" height="45" rx="4" fill="#d97706"/><rect x="22" y="36" width="12" height="14" rx="2" fill="#bae6fd"/><rect x="40" y="36" width="12" height="14" rx="2" fill="#bae6fd"/><rect x="58" y="36" width="12" height="14" rx="2" fill="#bae6fd"/><rect x="20" y="20" width="8" height="10" fill="#78350f"/><circle cx="28" cy="72" r="7" fill="#334155"/><circle cx="45" cy="72" r="7" fill="#334155"/><circle cx="62" cy="72" r="7" fill="#334155"/><circle cx="80" cy="72" r="7" fill="#334155"/></svg>`,
      bike: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><circle cx="28" cy="60" r="18" fill="none" stroke="#10b981" stroke-width="5"/><circle cx="72" cy="60" r="18" fill="none" stroke="#10b981" stroke-width="5"/><path d="M28 60 L46 60 L58 38 L72 60 M46 60 L38 38 L55 38 M72 60 L68 30 M62 30 L74 30" stroke="#047857" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
      car: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><path d="M15 52 Q25 32 45 30 L62 30 Q78 35 85 52 L88 65 Q88 68 82 68 L18 68 Q12 68 12 60 Z" fill="#6366f1"/><path d="M30 50 L42 35 L58 35 L68 50 Z" fill="#c7d2fe"/><circle cx="30" cy="68" r="9" fill="#1e293b"/><circle cx="30" cy="68" r="4" fill="#cbd5e1"/><circle cx="70" cy="68" r="9" fill="#1e293b"/><circle cx="70" cy="68" r="4" fill="#cbd5e1"/></svg>`,
      bus: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><rect x="12" y="25" width="76" height="45" rx="8" fill="#eab308"/><rect x="18" y="32" width="14" height="16" rx="2" fill="#bae6fd"/><rect x="36" y="32" width="14" height="16" rx="2" fill="#bae6fd"/><rect x="54" y="32" width="14" height="16" rx="2" fill="#bae6fd"/><rect x="72" y="32" width="12" height="24" rx="2" fill="#bae6fd"/><line x1="12" y1="54" x2="88" y2="54" stroke="#ca8a04" stroke-width="3"/><circle cx="28" cy="70" r="8" fill="#334155"/><circle cx="72" cy="70" r="8" fill="#334155"/></svg>`,
      boat: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><path d="M15 55 L85 55 L75 80 L25 80 Z" fill="#06b6d4"/><rect x="45" y="25" width="6" height="30" fill="#64748b"/><path d="M51 25 L78 38 L51 50 Z" fill="#0891b2"/><path d="M10 65 Q30 58 50 65 T90 65 L90 85 L10 85 Z" fill="#0284c7" opacity="0.4"/></svg>`,
      helicopter: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><line x1="15" y1="20" x2="85" y2="20" stroke="#475569" stroke-width="5" stroke-linecap="round"/><rect x="47" y="20" width="6" height="15" fill="#475569"/><ellipse cx="50" cy="50" rx="28" ry="20" fill="#14b8a6"/><path d="M50 35 Q70 35 75 50 L50 50 Z" fill="#ccfbf1"/><path d="M22 50 L5 48 L5 40 L12 45 Z" fill="#0d9488"/><rect x="30" y="72" width="40" height="4" fill="#334155"/><line x1="38" y1="68" x2="38" y2="72" stroke="#334155" stroke-width="3"/><line x1="62" y1="68" x2="62" y2="72" stroke="#334155" stroke-width="3"/></svg>`,
      lorry: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><rect x="10" y="32" width="45" height="38" rx="3" fill="#a855f7"/><rect x="58" y="42" width="28" height="28" rx="4" fill="#9333ea"/><rect x="68" y="46" width="14" height="12" rx="2" fill="#e9d5ff"/><circle cx="24" cy="70" r="8" fill="#334155"/><circle cx="38" cy="70" r="8" fill="#334155"/><circle cx="74" cy="70" r="8" fill="#334155"/></svg>`,
      taxi: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><path d="M15 52 Q25 32 45 30 L62 30 Q78 35 85 52 L88 65 Q88 68 82 68 L18 68 Q12 68 12 60 Z" fill="#f59e0b"/><rect x="42" y="22" width="16" height="8" rx="2" fill="#1e293b"/><text x="50" y="28" font-size="6" fill="#ffffff" text-anchor="middle" font-weight="bold">TAXI</text><path d="M30 50 L42 35 L58 35 L68 50 Z" fill="#fef3c7"/><rect x="15" y="55" width="70" height="5" fill="#1e293b" stroke="#ffffff" stroke-dasharray="4,4"/><circle cx="30" cy="68" r="8" fill="#1e293b"/><circle cx="70" cy="68" r="8" fill="#1e293b"/></svg>`,
      motorbike: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><circle cx="25" cy="62" r="15" fill="none" stroke="#f43f5e" stroke-width="6"/><circle cx="75" cy="62" r="15" fill="none" stroke="#f43f5e" stroke-width="6"/><path d="M25 62 L45 42 L65 42 L75 62 M45 42 L38 30 L55 30" stroke="#be123c" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="40" y="38" width="18" height="10" rx="3" fill="#881337"/></svg>`,
      ship: `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow"><path d="M10 50 L90 50 L80 80 L20 80 Z" fill="#1e3a8a"/><rect x="25" y="32" width="50" height="18" fill="#ffffff" rx="2"/><rect x="35" y="20" width="30" height="12" fill="#ef4444" rx="2"/><rect x="42" y="8" width="6" height="12" fill="#334155"/><rect x="52" y="8" width="6" height="12" fill="#334155"/><circle cx="35" cy="40" r="3" fill="#3b82f6"/><circle cx="50" cy="40" r="3" fill="#3b82f6"/><circle cx="65" cy="40" r="3" fill="#3b82f6"/></svg>`
    };

    // Web Audio Synthesizer
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(160, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'victory') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.15);
          osc.frequency.setValueAtTime(783.99, now + 0.3);
          osc.frequency.setValueAtTime(1046.50, now + 0.45);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
          osc.start(now);
          osc.stop(now + 0.7);
        }
      } catch (e) {
        console.log("Audio not supported or restricted", e);
      }
    }

    // Speech Synthesis
    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Mode Switcher
    function switchMode(mode) {
      currentMode = mode;
      const tabMatch = document.getElementById('tab-match');
      const tabSpell = document.getElementById('tab-spell');
      const containerMatch = document.getElementById('mode-matching-container');
      const containerSpell = document.getElementById('mode-spelling-container');

      [tabMatch, tabSpell].forEach(t => {
        if (t) t.className = 'font-fun px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all text-slate-600 hover:bg-white/60 flex items-center gap-1.5';
      });
      [containerMatch, containerSpell].forEach(c => {
        if (c) c.classList.add('hidden');
      });

      if (mode === 'match') {
        if (tabMatch) tabMatch.className = 'font-fun px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all bg-sky-500 text-white shadow-md flex items-center gap-1.5';
        if (containerMatch) containerMatch.classList.remove('hidden');
        updateProgressBar(matchedPairs);
      } else if (mode === 'spell') {
        if (tabSpell) tabSpell.className = 'font-fun px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all bg-emerald-500 text-white shadow-md flex items-center gap-1.5';
        if (containerSpell) containerSpell.classList.remove('hidden');
        updateProgressBar(spellingIndex);
        loadSpellingWord();
      }
    }

    function updateProgressBar(count) {
      const percent = Math.min(100, Math.round((count / vocabulary.length) * 100));
      const bar = document.getElementById('progress-bar');
      const txt = document.getElementById('progress-text');
      if (bar) bar.style.width = `${percent}%`;
      if (txt) txt.textContent = `${count}/${vocabulary.length}`;
    }

    function clearHints() {
      document.querySelectorAll('.hint-highlight').forEach(el => el.classList.remove('hint-highlight'));
    }

    // Initialize Matching Game
    function initMatchingGame() {
      selectedWord = null;
      selectedPicture = null;
      matchedPairs = 0;
      hintsRemaining = 3;

      const hintCountEl = document.getElementById('hint-count');
      const modalEl = document.getElementById('victory-modal');
      
      if (hintCountEl) hintCountEl.textContent = hintsRemaining;
      if (modalEl) modalEl.classList.add('hidden');
      updateProgressBar(0);

      const shuffledWords = shuffle(vocabulary);
      const shuffledPictures = shuffle(vocabulary);

      const wordsContainer = document.getElementById('words-container');
      const picturesContainer = document.getElementById('pictures-container');

      if (!wordsContainer || !picturesContainer) return;

      wordsContainer.innerHTML = '';
      picturesContainer.innerHTML = '';

      shuffledWords.forEach(item => {
        const card = document.createElement('div');
        card.className = `word-card ${item.color} border-4 rounded-2xl p-2.5 sm:p-3 text-center cursor-pointer game-card-shadow flex items-center justify-between font-fun text-sm sm:text-lg transition-all`;
        card.dataset.id = item.id;
        card.onclick = () => selectWordCard(card, item);

        card.innerHTML = `
          <span>${item.name}</span>
          <button onclick="event.stopPropagation(); speakWord('${item.name}')" class="bg-white hover:bg-amber-100 text-slate-700 p-1 rounded-full shadow border border-slate-200 text-xs">🔊</button>
        `;

        card.draggable = true;
        card.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', item.id);
          selectWordCard(card, item);
        };

        wordsContainer.appendChild(card);
      });

      shuffledPictures.forEach(item => {
        const card = document.createElement('div');
        card.className = `picture-card bg-white border-4 border-slate-200 rounded-2xl p-2 text-center cursor-pointer game-card-shadow flex flex-col items-center justify-center aspect-square transition-all`;
        card.dataset.id = item.id;
        card.onclick = () => selectPictureCard(card, item);

        card.innerHTML = `<div class="w-14 h-14 sm:w-16 sm:h-16 pointer-events-none">${svgIcons[item.id]}</div>`;

        card.ondragover = (e) => e.preventDefault();
        card.ondrop = (e) => {
          e.preventDefault();
          const draggedId = e.dataTransfer.getData('text/plain');
          if (draggedId === item.id) {
            selectPictureCard(card, item);
          } else {
            playSound('wrong');
          }
        };

        picturesContainer.appendChild(card);
      });
    }

    function selectWordCard(card, item) {
      if (card.classList.contains('matched-card')) return;
      playSound('select');
      speakWord(item.name);
      document.querySelectorAll('.word-card').forEach(c => c.classList.remove('selected-card'));
      clearHints();
      selectedWord = { card, item };
      card.classList.add('selected-card');
      checkMatch();
    }

    function selectPictureCard(card, item) {
      if (card.classList.contains('matched-card')) return;
      playSound('select');
      document.querySelectorAll('.picture-card').forEach(c => c.classList.remove('selected-card'));
      clearHints();
      selectedPicture = { card, item };
      card.classList.add('selected-card');
      checkMatch();
    }

    function checkMatch() {
      if (!selectedWord || !selectedPicture) return;

      if (selectedWord.item.id === selectedPicture.item.id) {
        playSound('correct');
        speakWord(selectedWord.item.name);

        selectedWord.card.classList.remove('selected-card');
        selectedPicture.card.classList.remove('selected-card');

        selectedWord.card.classList.add('matched-card');
        selectedPicture.card.classList.add('matched-card');

        const badge = document.createElement('div');
        badge.className = 'absolute -top-2 -right-2 bg-emerald-500 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs shadow border border-white';
        badge.textContent = '✓';
        selectedPicture.card.style.position = 'relative';
        selectedPicture.card.appendChild(badge);

        matchedPairs++;
        updateProgressBar(matchedPairs);

        selectedWord = null;
        selectedPicture = null;

        if (matchedPairs === vocabulary.length) {
          setTimeout(handleMatchVictory, 600);
        }
      } else {
        playSound('wrong');
        const wCard = selectedWord.card;
        const pCard = selectedPicture.card;

        wCard.classList.add('border-red-400');
        pCard.classList.add('border-red-400');

        setTimeout(() => {
          wCard.classList.remove('selected-card', 'border-red-400');
          pCard.classList.remove('selected-card', 'border-red-400');
        }, 400);

        selectedWord = null;
        selectedPicture = null;
      }
    }

    function handleMatchVictory() {
      playSound('victory');
      if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

      const title = document.getElementById('modal-title');
      const msg = document.getElementById('modal-msg');
      const modal = document.getElementById('victory-modal');

      if (title) title.textContent = '🏆 圖畫配對成功！';
      if (msg) msg.textContent = '你太棒了！已完全正確配對所有 12 個交通工具生字！';
      if (modal) modal.classList.remove('hidden');
    }

    // Hint Logic
    function useHint() {
      if (hintsRemaining <= 0) return;

      if (currentMode === 'match') {
        const unmatchedWords = Array.from(document.querySelectorAll('.word-card:not(.matched-card)'));
        if (unmatchedWords.length === 0) return;

        const targetWordCard = unmatchedWords[Math.floor(Math.random() * unmatchedWords.length)];
        const targetId = targetWordCard.dataset.id;
        const targetPictureCard = document.querySelector(`.picture-card[data-id="${targetId}"]`);

        clearHints();
        if (targetWordCard) targetWordCard.classList.add('hint-highlight');
        if (targetPictureCard) targetPictureCard.classList.add('hint-highlight');

        hintsRemaining--;
        const hintCountEl = document.getElementById('hint-count');
        if (hintCountEl) hintCountEl.textContent = hintsRemaining;
        playSound('select');
      } else if (currentMode === 'spell') {
        showPhonicsHint();
        const targetWord = vocabulary[spellingIndex].name;
        for (let i = 0; i < targetWord.length; i++) {
          if (spellingInput[i] !== targetWord[i]) {
            const neededLetter = targetWord[i];
            const tileIdx = currentJumbledLetters.findIndex((item) => item.letter === neededLetter && !item.used);
            if (tileIdx !== -1) {
              spellingInput[i] = neededLetter;
              currentJumbledLetters[tileIdx].used = true;
              hintsRemaining--;
              const hintCountEl = document.getElementById('hint-count');
              if (hintCountEl) hintCountEl.textContent = hintsRemaining;
              playSound('select');
              renderSpellingUI();
              checkSpellingMatch();
              break;
            }
          }
        }
      }
    }

    function showPhonicsHint() {
      const current = vocabulary[spellingIndex];
      const box = document.getElementById('phonics-hint-box');
      const txt = document.getElementById('phonics-text');
      const detail = document.getElementById('phonics-detail');

      if (txt) txt.textContent = current.phonics;
      if (detail) detail.textContent = current.hint;
      if (box) box.classList.remove('hidden');
    }

    function speakPhonicsHint() {
      const current = vocabulary[spellingIndex];
      const speechText = `${current.name}. Phonics breakdown: ${current.phonics.replace(/-/g, ' ')}`;
      speakWord(speechText);
    }

    // MODE 2: Spelling Logic
    function loadSpellingWord() {
      const current = vocabulary[spellingIndex];
      updateProgressBar(spellingIndex + 1);

      const imgBox = document.getElementById('spelling-image-box');
      const hintBox = document.getElementById('phonics-hint-box');
      const prevBtn = document.getElementById('prev-spell-btn');

      if (imgBox) imgBox.innerHTML = svgIcons[current.id];
      if (hintBox) hintBox.classList.add('hidden');

      const letters = current.name.split('');
      const shuffled = shuffle(letters).map((letter, id) => ({ id, letter, used: false }));
      currentJumbledLetters = shuffled;
      spellingInput = [];

      renderSpellingUI();
      speakWord(current.name);

      if (prevBtn) prevBtn.disabled = (spellingIndex === 0);
    }

    function renderSpellingUI() {
      const currentWord = vocabulary[spellingIndex].name;
      const slotsContainer = document.getElementById('spelling-slots');
      const tilesContainer = document.getElementById('spelling-tiles');

      if (!slotsContainer || !tilesContainer) return;

      slotsContainer.innerHTML = '';
      tilesContainer.innerHTML = '';

      for (let i = 0; i < currentWord.length; i++) {
        const slot = document.createElement('div');
        const filledLetter = spellingInput[i] || '';
        slot.className = `letter-slot w-9 h-11 sm:w-11 sm:h-13 bg-sky-50 border-b-4 border-sky-500 rounded-xl flex items-center justify-center font-fun text-lg sm:text-xl ${filledLetter ? 'text-sky-700 bg-sky-100 border-sky-600' : 'text-transparent'}`;
        slot.textContent = filledLetter || '_';
        slotsContainer.appendChild(slot);
      }

      currentJumbledLetters.forEach((item, index) => {
        const tile = document.createElement('button');
        tile.className = `letter-tile font-fun text-lg sm:text-xl w-10 h-10 sm:w-12 sm:h-12 rounded-2xl border-2 border-amber-300 flex items-center justify-center relative overflow-hidden ${item.used ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-amber-300 hover:bg-amber-400 text-amber-950 cursor-pointer'}`;
        tile.textContent = item.letter;
        tile.disabled = item.used;
        tile.onclick = () => tapLetterTile(index);
        tilesContainer.appendChild(tile);
      });
    }

    function tapLetterTile(index) {
      if (currentJumbledLetters[index].used) return;
      playSound('select');

      const letter = currentJumbledLetters[index].letter;
      currentJumbledLetters[index].used = true;
      spellingInput.push(letter);

      renderSpellingUI();
      checkSpellingMatch();
    }

    function backspaceSpelling() {
      if (spellingInput.length === 0) return;
      playSound('select');

      const removedLetter = spellingInput.pop();
      const tileIdx = currentJumbledLetters.findIndex(item => item.letter === removedLetter && item.used);
      if (tileIdx !== -1) {
        currentJumbledLetters[tileIdx].used = false;
      }
      renderSpellingUI();
    }

    function clearSpelling() {
      if (spellingInput.length === 0) return;
      playSound('select');
      spellingInput = [];
      currentJumbledLetters.forEach(item => item.used = false);
      renderSpellingUI();
    }

    function checkSpellingMatch() {
      const targetWord = vocabulary[spellingIndex].name;
      const currentString = spellingInput.join('');

      if (currentString.length === targetWord.length) {
        if (currentString === targetWord) {
          playSound('correct');
          speakWord(targetWord);
          const hintBox = document.getElementById('phonics-hint-box');
          if (hintBox) hintBox.classList.add('hidden');

          if (typeof confetti === 'function') {
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          }

          setTimeout(() => {
            if (spellingIndex < vocabulary.length - 1) {
              spellingIndex++;
              loadSpellingWord();
            } else {
              handleSpellingVictory();
            }
          }, 900);
        } else {
          playSound('wrong');
          showPhonicsHint();
          speakPhonicsHint();

          const slotsContainer = document.getElementById('spelling-slots');
          if (slotsContainer) {
            slotsContainer.classList.add('animate-bounce');
            setTimeout(() => slotsContainer.classList.remove('animate-bounce'), 500);
          }
        }
      }
    }

    function navSpelling(direction) {
      playSound('select');
      spellingIndex += direction;
      if (spellingIndex < 0) spellingIndex = 0;
      if (spellingIndex >= vocabulary.length) spellingIndex = vocabulary.length - 1;
      loadSpellingWord();
    }

    function speakCurrentSpellingWord() {
      speakWord(vocabulary[spellingIndex].name);
    }

    function handleSpellingVictory() {
      playSound('victory');
      if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

      const title = document.getElementById('modal-title');
      const msg = document.getElementById('modal-msg');
      const modal = document.getElementById('victory-modal');

      if (title) title.textContent = '🏆 劍橋串字達人！';
      if (msg) msg.textContent = '太厲害了！你已經順利拼出所有 12 個交通工具英文單字！';
      if (modal) modal.classList.remove('hidden');
    }

    function resetCurrentGame() {
      if (currentMode === 'match') {
        initMatchingGame();
      } else {
        spellingIndex = 0;
        loadSpellingWord();
      }
      const modal = document.getElementById('victory-modal');
      if (modal) modal.classList.add('hidden');
    }

    // Startup Initializer
    window.addEventListener('DOMContentLoaded', () => {
      initMatchingGame();
    });
  </script>
</body>
</html>
